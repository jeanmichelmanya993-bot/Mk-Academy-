
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172b4d}
header{background:#123b78;color:white;padding:22px;text-align:center}
header h1{margin:0}
main{max-width:900px;margin:30px auto;padding:20px}
.panel{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 12px #0001;max-width:480px;margin:25px auto}
h2{text-align:center;color:#123b78}
input{width:100%;padding:13px;margin:9px 0;border:1px solid #ccd5e2;border-radius:7px;font-size:16px}
button{background:#123b78;color:white;border:0;padding:13px 18px;border-radius:7px;font-weight:bold;cursor:pointer;margin:5px}
.secondary{background:#e7efff;color:#123b78}
.actions{text-align:center}
#message{text-align:center;line-height:1.5;margin-top:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}
.card h3{color:#123b78;font-size:17px}
.price{font-weight:bold;color:#123b78}
.hidden{display:none}
footer{text-align:center;background:#123b78;color:white;padding:20px;margin-top:35px}
</style>
</head>
<body>

<header>
<h1>MK ACADEMY</h1>
<p>Apprendre • Progresser • Réussir</p>
</header>

<main>
<section id="authSection" class="panel">
<h2>Bienvenue sur MK Academy</h2>
<p style="text-align:center">Crée ton compte ou connecte-toi pour découvrir nos formations.</p>

<div class="actions">
<button onclick="showForm('signup')">Créer un compte</button>
<button class="secondary" onclick="showForm('login')">Se connecter</button>
</div>

<form id="authForm">
<div id="nameArea">
<input id="fullname" type="text" placeholder="Ton nom complet">
</div>
<input id="email" type="email" placeholder="Adresse e-mail" required>
<input id="password" type="password" placeholder="Mot de passe" required minlength="6">
<button id="submitBtn" type="submit" style="width:100%">Créer mon compte</button>
</form>
<p id="message"></p>
</section>

<section id="courseSection" class="hidden">
<div style="text-align:center">
<h2>Nos formations</h2>
<p id="welcome"></p>
<button onclick="logout()">Se déconnecter</button>
</div>
<div id="catalogue" class="grid"></div>
<p id="courseMessage"></p>
</section>
</main>

<footer>© 2026 MK Academy — Tous droits réservés.</footer>

<script>
const SUPABASE_URL = "https://symnweeensaeituthxdb.supabase.co";
const SUPABASE_KEY = "sb_publishable_IobwmYlux9WOJHYUal_LkA_9Y2JyqcH";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentMode = "signup";

function showForm(mode){
  currentMode = mode;
  document.getElementById("message").textContent = "";
  document.getElementById("nameArea").classList.toggle("hidden", mode === "login");
  document.getElementById("submitBtn").textContent =
    mode === "signup" ? "Créer mon compte" : "Se connecter";
}

document.getElementById("authForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const message = document.getElementById("message");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const name = document.getElementById("fullname").value.trim();

  message.textContent = "Veuillez patienter...";

  try {
    if(currentMode === "signup"){
      if(!name){
        message.textContent = "Entre ton nom complet.";
        return;
      }

      const {data,error} = await db.auth.signUp({
        email,
        password,
        options:{
          data:{full_name:name},
          emailRedirectTo:"https://jeanmichelmanya993-bot.github.io/Mk-Academy-/"
        }
      });

      if(error) throw error;

      if(data.session){
        message.textContent = "Compte créé avec succès.";
        await showCourses(data.session.user);
      } else {
        message.textContent = "Compte créé ! Vérifie ta boîte e-mail et confirme ton adresse avant de te connecter.";
      }

    } else {
      const {data,error} = await db.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      await showCourses(data.user);
    }
  } catch(error){
    message.textContent = "Erreur : " + error.message;
  }
});

async function showCourses(user){
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("courseSection").classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Bienvenue " + (user.user_metadata?.full_name || user.email);
  await loadCourses();
}

async function loadCourses(){
  const catalogue = document.getElementById("catalogue");
  const message = document.getElementById("courseMessage");

  catalogue.innerHTML = "";
  message.textContent = "Chargement des formations...";

  const {data,error} = await db
    .from("courses")
    .select("title,description,duration_days,price_usd")
    .eq("is_published",true)
    .order("sort_order");

  if(error){
    message.textContent = "Impossible de charger les formations : " + error.message;
    return;
  }

  if(!data || data.length === 0){
    message.textContent = "Aucune formation publiée pour le moment.";
    return;
  }

  data.forEach((formation,index)=>{
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = (index+1) + ". " + formation.title;

    const description = document.createElement("p");
    description.textContent = formation.description || "";

    const duration = document.createElement("p");
    duration.textContent = "Durée : " + formation.duration_days + " jours";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "Prix : " + formation.price_usd + " USD";

    card.append(title,description,duration,price);
    catalogue.appendChild(card);
  });

  message.textContent = "";
}

async function logout(){
  const {error} = await db.auth.signOut();
  if(error){
    alert("Erreur : " + error.message);
    return;
  }
  document.getElementById("courseSection").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");
  document.getElementById("authForm").reset();
  showForm("login");
}

db.auth.onAuthStateChange((event,session)=>{
  if(session && event === "SIGNED_IN"){
    showCourses(session.user);
  }
});

async function checkSession(){
  const {data,error} = await db.auth.getSession();

  if(error){
    document.getElementById("message").textContent = error.message;
    return;
  }

  if(data.session){
    await showCourses(data.session.user);
  }
}

checkSession();
</script>
</body>
</html>
