<script>
/* MK ACADEMY — MODULE CHAPITRES */

let mkCurrentCourse = null;
let mkChapterAccess = [];

function mkMessage(id, text) {
  
function mkCreateReader() {
  if (document.getElementById("mkReader")) return;

  const reader = document.createElement("div");
  reader.id = "mkReader";
  reader.className = "panel";
  reader.style.cssText =
    "position:fixed;inset:10px;z-index:100;background:var(--bg);overflow:auto;padding:22px;border:2px solid var(--purple);";

  reader.innerHTML = `
    <button class="secondary" onclick="mkCloseReader()">← Retour</button>
    <h2 id="mkCourseTitle">Formation</h2>
    <div id="mkChapterList">Chargement...</div>
    <div id="mkChapterContent" class="panel hidden"></div>
  `;

  document.body.appendChild(reader);
}

function mkCloseReader() {
  document.getElementById("mkReader")?.remove();
}

async function mkOpenCourse(courseId) {
  if (!currentUser) return alert("Connecte-toi pour accéder aux formations.");

  mkCreateReader();

  const course = allCourses.find(c => c.id === courseId);
  if (!course) return alert("Formation introuvable.");

  mkCurrentCourse = course;

  document.getElementById("mkCourseTitle").textContent = course.title;

  const list = document.getElementById("mkChapterList");
  const content = document.getElementById("mkChapterContent");

  list.textContent = "Chargement des chapitres...";

  const { data: chapters, error } = await db
    .from("chapters")
    .select("id,title,is_free_intro,sort_order,price_usd")
    .eq("course_id", courseId)
    .order("sort_order");

  if (error) {
    list.textContent = "Erreur : " + error.message;
    return;
  }

  if (!chapters?.length) {
    list.textContent = "Aucun chapitre disponible.";
    return;
  }

  const { data: access, error: accessError } = await db
    .from("course_access")
    .select("chapter_id")
    .eq("user_id", currentUser.id)
    .eq("course_id", courseId);

  if (accessError) {
    list.textContent = "Erreur d'accès : " + accessError.message;
    return;
  }

  mkChapterAccess = (access || []).map(a => a.chapter_id);

  list.innerHTML = "";

  chapters.forEach(chapter => {
    const unlocked =
      chapter.is_free_intro ||
      mkChapterAccess.includes(chapter.id);

    const button = document.createElement("button");
    button.className = unlocked ? "success full" : "secondary full";

    button.textContent =
      (unlocked ? "🔓 " : "🔒 ") +
      chapter.title +
      (chapter.is_free_intro
        ? " — GRATUIT"
        : " — " + Number(chapter.price_usd || 0) + " USD");

    button.onclick = () => mkOpenChapter(chapter);
    list.appendChild(button);
  });
}

async function mkOpenChapter(chapter) {
  const content = document.getElementById("mkChapterContent");
  content.classList.remove("hidden");
  content.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = chapter.title;
  content.appendChild(heading);

  const unlocked =
    chapter.is_free_intro ||
    mkChapterAccess.includes(chapter.id);

  if (!unlocked) {
    mkShowPaymentForm(chapter, content);
    return;
  }

  const { data: lessons, error } = await db
    .from("lessons")
    .select("id,title,content,video_url,pdf_url,sort_order")
    .eq("chapter_id", chapter.id)
    .order("sort_order");

  if (error) {
    content.append("Erreur : " + error.message);
    return;
  }

  if (!lessons?.length) {
    content.append("Les leçons seront bientôt disponibles.");
    return;
  }

  lessons.forEach((lesson, index) => {
    const block = document.createElement("div");
    block.className = "panel";

    const title = document.createElement("h3");
    title.textContent = "Leçon " + (index + 1) + " : " + lesson.title;

    const text = document.createElement("p");
    text.style.whiteSpace = "pre-wrap";
    text.textContent = lesson.content || "Contenu bientôt disponible.";

    block.append(title, text);

    if (lesson.video_url) {
      const link = document.createElement("a");
      link.href = lesson.video_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "▶ Voir la vidéo";
      block.appendChild(link);
    }

    if (lesson.pdf_url) {
      const link = document.createElement("a");
      link.href = lesson.pdf_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "📄 Télécharger le document";
      block.appendChild(link);
    }

    content.appendChild(block);
  });
}

function mkShowPaymentForm(chapter, container) {
  const price = Number(chapter.price_usd || 0);

  if (price <= 0) {
    container.append("Prix non défini. Contacte l'administration.");
    return;
  }

  const info = document.createElement("p");
  info.textContent = "Prix : " + price + " USD";

  const method = document.createElement("select");
  method.className = "field";
  method.innerHTML = `
    <option>M-Pesa</option>
    <option>Airtel Money</option>
    <option>Orange Money</option>
    <option>Autre</option>
  `;

  const reference = document.createElement("input");
  reference.className = "field";
  reference.placeholder = "Référence de transaction";

  const button = document.createElement("button");
  button.className = "primary full";
  button.textContent = "Envoyer ma demande";

  button.onclick = async () => {
    if (!reference.value.trim()) {
      alert("Entre la référence de transaction.");
      return;
    }

    button.disabled = true;
    button.textContent = "Envoi...";

    const { error } = await db.from("orders").insert({
      user_id: currentUser.id,
      course_id: mkCurrentCourse.id,
      chapter_id: chapter.id,
      amount_usd: price,
      payment_method: method.value,
      transaction_reference: reference.value.trim(),
      status: "pending"
    });

    if (error) {
      alert("Erreur : " + error.message);
      button.disabled = false;
      button.textContent = "Envoyer ma demande";
      return;
    }

    container.innerHTML =
      "<p>Demande envoyée. Attends la validation de l'administration.</p>";
  };

  container.append(info, method, reference, button);
}

/* BOUTON CHAPITRES DANS LE CATALOGUE */

const mkRenderOriginal = renderCourses;

renderCourses = function() {
  mkRenderOriginal();

  document.querySelectorAll("#catalogue .card").forEach(card => {
    const title = card.querySelector("h3")?.textContent;
    const course = allCourses.find(c => c.title === title);

    if (!course || card.querySelector(".mk-chapters-button")) return;

    const button = document.createElement("button");
    button.className = "gold-button full mk-chapters-button";
    button.textContent = "📚 Voir les chapitres";
    button.onclick = () => mkOpenCourse(course.id);

    card.querySelector(".card-body")?.appendChild(button);
  });
};

/* ADMINISTRATION DES CHAPITRES */

function mkCreateAdminPanel() {
  if (document.getElementById("mkAdminChapters")) return;

  const panel = document.createElement("div");
  panel.id = "mkAdminChapters";
  panel.className = "panel section";

  panel.innerHTML = `
    <h3>Gestion des chapitres et des prix</h3>
    <select id="mkAdminCourse" class="field">
      <option value="">Choisir une formation</option>
    </select>
    <div id="mkAdminChapterList"></div>
    <hr>
    <h3>Demandes de paiement des chapitres</h3>
    <button class="secondary" onclick="mkLoadOrders()">Actualiser</button>
    <p id="mkOrderMessage" class="message"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Apprenant</th>
            <th>Chapitre</th>
            <th>Prix</th>
            <th>Moyen</th>
            <th>Référence</th>
            <th>Statut</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="mkOrderRows"></tbody>
      </table>
    </div>
  `;

  document.getElementById("adminTab").appendChild(panel);

  document.getElementById("mkAdminCourse").onchange =
    mkLoadAdminChapters;
}

async function mkLoadAdminChapters() {
  const courseId = document.getElementById("mkAdminCourse").value;
  const container = document.getElementById("mkAdminChapterList");

  container.innerHTML = "";
  if (!courseId) return;

  const { data, error } = await db
    .from("chapters")
    .select("id,title,is_free_intro,price_usd")
    .eq("course_id", courseId)
    .order("sort_order");

  if (error) {
    container.textContent = error.message;
    return;
  }

  (data || []).forEach(chapter => {
    const row = document.createElement("div");
    row.className = "panel";

    const title = document.createElement("strong");
    title.textContent = chapter.title +
      (chapter.is_free_intro ? " — GRATUIT" : "");

    const price = document.createElement("input");
    price.className = "field";
    price.type = "number";
    price.min = "0";
    price.step = "0.01";
    price.value = chapter.price_usd ?? 0;
    price.disabled = !!chapter.is_free_intro;

    const save = document.createElement("button");
    save.className = "primary";
    save.textContent = "Enregistrer le prix";

    save.onclick = async () => {
      const { error } = await db
        .from("chapters")
        .update({ price_usd: Number(price.value) })
        .eq("id", chapter.id);

      if (error) alert("Erreur : " + error.message);
      else alert("Prix enregistré.");
    };

    row.append(title, price, save);
    container.appendChild(row);
  });
}

async function mkLoadOrders() {
  if (!isAdmin) return;

  const rows = document.getElementById("mkOrderRows");
  rows.innerHTML = "";
  mkMessage("mkOrderMessage", "Chargement...");

  const { data, error } = await db
    .from("orders")
    .select("*")
    .not("chapter_id", "is", null)
    .order("created_at", { ascending: false });

  if (error) {
    mkMessage("mkOrderMessage", "Erreur : " + error.message);
    return;
  }

  if (!data?.length) {
    mkMessage("mkOrderMessage", "Aucune demande de paiement.");
    return;
  }

  for (const order of data) {
    const [profile, course, chapter] = await Promise.all([
      db.from("profiles").select("full_name").eq("id", order.user_id).maybeSingle(),
      db.from("courses").select("title").eq("id", order.course_id).maybeSingle(),
      db.from("chapters").select("title").eq("id", order.chapter_id).maybeSingle()
    ]);

    const tr = document.createElement("tr");
    const values = [
      profile.data?.full_name || order.user_id,
      (course.data?.title || "") + " / " + (chapter.data?.title || ""),
      order.amount_usd + " USD",
      order.payment_method || "",
      order.transaction_reference || "",
      statusText(order.status)
    ];

    values.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const actions = document.createElement("td");

    if (order.status === "pending") {
      const approve = document.createElement("button");
      approve.className = "success";
      approve.textContent = "Valider";
      approve.onclick = () => mkReviewOrder(order, true);

      const reject = document.createElement("button");
      reject.className = "danger";
      reject.textContent = "Refuser";
      reject.onclick = () => mkReviewOrder(order, false);

      actions.append(approve, reject);
    }

    tr.appendChild(actions);
    rows.appendChild(tr);
  }

  mkMessage("mkOrderMessage", data.length + " demande(s).");
}

async function mkReviewOrder(order, approve) {
  if (!isAdmin) return;

  if (!confirm(approve
    ? "Valider le paiement et débloquer ce chapitre ?"
    : "Refuser cette demande ?")) return;

  if (approve) {
    const { error } = await db.from("course_access").upsert({
      user_id: order.user_id,
      course_id: order.course_id,
      chapter_id: order.chapter_id
    }, { onConflict: "user_id,chapter_id" });

    if (error) {
      alert("Erreur d'accès : " + error.message);
      return;
    }
  }

  const { error } = await db
    .from("orders")
    .update({ status: approve ? "approved" : "rejected" })
    .eq("id", order.id);

  if (error) {
    alert("Erreur : " + error.message);
    return;
  }

  alert(approve ? "Chapitre débloqué." : "Demande refusée.");
  mkLoadOrders();
}

async function mkInitializeAdmin() {
  if (!isAdmin) return;

  mkCreateAdminPanel();

  const select = document.getElementById("mkAdminCourse");
  const { data, error } = await db
    .from("courses")
    .select("id,title")
    .order("sort_order");

  if (error) {
    mkMessage("mkOrderMessage", error.message);
    return;
  }

  (data || []).forEach(course => {
    const option = document.createElement("option");
    option.value = course.id;
    option.textContent = course.title;
    select.appendChild(option);
  });

  await mkLoadOrders();
}

/* INTÉGRATION À L'APPLICATION */

const mkEnterOriginal = enterApp;

enterApp = async function(user) {
  await mkEnterOriginal(user);
  if (isAdmin) await mkInitializeAdmin();
};

/* DÉMARRAGE APRÈS CHARGEMENT DU MODULE */

initialize();
 </script>
